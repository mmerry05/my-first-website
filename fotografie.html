    /* Flexboxen Container */
.flexi {
    display: flex;
    flex-wrap: wrap;
    flex-direction: row;
    gap: 30px; /* Erzeugt Abstand zwischen den Boxen */
    justify-content: center; /* Zentriert die Boxen auf dem Bildschirm */
    padding: 0;
    list-style: none; /* Entfernt die Listenpunkte der Boxen */
}

/* Die Boxen selbst */
.box {
    border: 1px solid #ccc; /* Macht die Box-Grenzen sichtbar */
    border-radius: 8px; /* Leicht abgerundete Ecken */
    padding: 40px 20px; /* Innenabstand für den Text */
    background-color: #fff; /* Weißer Hintergrund für die Box */
    text-align: center;
    width: 250px; /* Gibt den Boxen eine einheitliche Breite */
    transition: transform 0.2s, box-shadow 0.2s;
}

/* Verhindert, dass der Text weiß und unsichtbar wird */
.box a {
    text-decoration: none;
    color: black; /* Textfarbe auf Schwarz ändern */
    display: block;
    width: 100%;
    height: 100%;
}

/* Hover-Effekt optimieren */
.box:hover {
    transform: translateY(-5px); /* Box hebt sich leicht an */
    box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.15); /* Deutlicherer Schatten */
}


       .img {
            width: 500px;
            height: auto;
            padding: 200px;
            /* Das ist der Zauber-Befehl: */
        view-timeline-name: --image-reveal;
        view-timeline-axis: block;
    
        animation: erscheinen linear both;
        animation-timeline: --image-reveal;
    
        /* Die Animation soll nur am Anfang des Scrollens passieren */
        animation-range: entry 70% cover 60%;
        }

  .img {
    width: 100%; /* ÄNDERUNG: Nutzt jetzt die volle Breite des Blocks */
    max-width: 800px; /* NEU: Verhindert, dass das Bild unendlich riesig wird */
    height: auto;
    padding: 0; /* ÄNDERUNG: Entfernt das quetschende Padding komplett */
    display: block;
    margin: 0 auto; /* NEU: Zentriert das breite Bild im Kasten */
    
    /* Ihre Scroll-Animation bleibt bestehen: */
    view-timeline-name: --image-reveal;
    view-timeline-axis: block;
    animation: erscheinen linear both;
    animation-timeline: --image-reveal;
    animation-range: entry 70% cover 60%;
}

@keyframes erscheinen {
    from {
        opacity: 0;
        transform: translateY(100px) scale(0.6); /* ÄNDERUNG: Startet bei 60% Größe statt winzigen 9% */
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
